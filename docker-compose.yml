# Phase 3 observability stack — root compose, side by side with banking.
#
# Banking's compose (custumers/digital-banking-services/docker-compose.yml) is
# UNTOUCHED. In Phase 3 both composes run side by side; the app reaches the
# Collector via host.docker.internal:4317/4318. That hostname is injected out
# of the box under Docker Desktop for Windows. It BREAKS under native Docker
# Engine / WSL2 without Docker Desktop (no auto-injected host gateway) — if
# you run there, add `host.docker.internal:host-gateway` extra_hosts on the
# app side (Step 4) or run the app on the `observability` network.
# Replaced by proper networking in Phase 7.
#
# Port map: Traefik publishes 443/tcp ONLY — the unique public ingestion +
# operator endpoint (banking/insurance OTLP via SNI Host routing, Grafana UI).
# Gateway exposes 4317/4318 (banking) + 4320/4321 (insurance) on the
# observability-internal network ONLY (no host ports, not on otel-ingress).
# Traefik bridges otel-ingress <-> observability-internal and terminates TLS
# with the local simulation cert in observability/traefik/certs/ (self-signed,
# committed for local simulation only — replace with real certs in production).
# Loki stays INTERNAL (plan) — reachable only inside the network.
# The internal otel-collector exposes OTLP on the observability network ONLY
# (no host ports) — the gateway is the sole public ingestion path.
#
# Healthcheck pattern: tempo + grafana ship wget/sh (real HTTP probes). loki,
# mimir and otel-collector images are DISTROLESS (verified: no sh/wget/curl),
# so no in-container probe binary exists — they run healthcheck NONE and their
# readiness is gated out-of-band (Grafana datasource checks for Loki/Tempo/
# Mimir, startup logs for the gateway and internal Collector). depends_on
# uses service_started for those three.

services:
  traefik:
    image: traefik:v3.5
    container_name: poc-traefik
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    # File provider only (no docker.sock): static routes in dynamic/routes.yml.
    # Avoids Docker API version issues and removes socket-mount attack surface.
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --api.dashboard=false
      - --accesslog=true
      - --metrics.prometheus=true
      - --log.level=INFO
    ports:
      - "443:443"
    volumes:
      - ./observability/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./observability/traefik/certs/edge.crt:/certs/edge.crt:ro
      - ./observability/traefik/certs/edge.key:/certs/edge.key:ro
    networks:
      otel-ingress:
        aliases:
          - traefik
          - banking-otlp.localhost
          - banking-http-otlp.localhost
          - insurance-otlp.localhost
          - insurance-http-otlp.localhost
          - retail-otlp.localhost
          - retail-http-otlp.localhost
          - grafana.localhost
      observability-internal: {}
    depends_on:
      otel-gateway:
        condition: service_started

  loki:
    image: grafana/loki:3.7.6
    container_name: poc-loki
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks:
      - observability-internal
    # Distroless (see header): readiness via Grafana Loki-datasource check.
    healthcheck:
      test: ["NONE"]

  tempo:
    image: grafana/tempo:2.8.0
    container_name: poc-tempo
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Tempo 2.8 image runs non-root; named volumes arrive root-owned, so it
    # cannot mkdir its data dirs. Root here is a local-POC concession.
    user: "0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo/config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    # Phase 7: no host ports — queried via Grafana datasource over the
    # internal network only.
    networks:
      - observability-internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mimir:
    image: grafana/mimir:2.16.0
    container_name: poc-mimir
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["-config.file=/etc/mimir/config.yaml"]
    volumes:
      - ./observability/mimir/config.yaml:/etc/mimir/config.yaml:ro
      - mimir-data:/tmp/mimir
    # Phase 7: no host ports — queried via Grafana datasource over the
    # internal network only.
    networks:
      - observability-internal
    # Distroless (see header): readiness via Grafana Mimir-datasource check.
    healthcheck:
      test: ["NONE"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    container_name: poc-otel-collector
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["--config=/etc/otel/collector-config.yaml"]
    volumes:
      - ./observability/otel/collector-config.yaml:/etc/otel/collector-config.yaml:ro
    # Phase 6: NO host ports — OTLP only on the observability network.
    # Public ingestion goes through otel-gateway (per-tenant token auth).
    networks:
      - observability-internal
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_healthy
      mimir:
        condition: service_started
    # Distroless (see header): readiness via gateway logs + downstream checks.
    healthcheck:
      test: ["NONE"]

  # Phase 6 — OTEL gateway: the sole public OTLP endpoint.
  # Per-tenant listener + token (banking :4317/:4318, insurance :4320/:4321);
  # each token maps to its tenant server-side and tenant.id is upserted,
  # so clients cannot spoof or override their tenant identity (FR-06).
  otel-gateway:
    image: otel/opentelemetry-collector-contrib:0.135.0
    container_name: poc-otel-gateway
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["--config=/etc/otel/gateway-config.yaml"]
    volumes:
      - ./observability/otel/gateway-config.yaml:/etc/otel/gateway-config.yaml:ro
    environment:
      # Real values via root .env (gitignored, see .env.example).
      # Fallbacks are dev-only placeholders for local bring-up.
      BANKING_TOKEN: ${BANKING_TOKEN:?BANKING_TOKEN must be set}
      INSURANCE_TOKEN: ${INSURANCE_TOKEN:?INSURANCE_TOKEN must be set}
      RETAIL_TOKEN: ${RETAIL_TOKEN:?RETAIL_TOKEN must be set}
    networks:
      - observability-internal
    # Routes are static in observability/traefik/dynamic/routes.yml (file provider).
    depends_on:
      otel-collector:
        condition: service_started
    # Distroless (see header): readiness via Traefik routing + gateway logs.
    healthcheck:
      test: ["NONE"]

  grafana:
    image: grafana/grafana:12.1.0
    container_name: poc-grafana
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      # Prod hardening #4: no hardcoded admin/admin. Values come from root
      # .env (see .env.example); fallbacks are local-only.
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:?GF_ADMIN_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    networks:
      - observability-internal
    # Route is static in observability/traefik/dynamic/routes.yml (file provider).
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_healthy
      mimir:
        condition: service_started
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  loki-data:
  tempo-data:
  mimir-data:
  grafana-data:

networks:
  otel-ingress:
    name: otel-ingress
  observability-internal:
    name: observability-internal
