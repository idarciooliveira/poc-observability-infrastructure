services:
  risk-service:
    build:
      context: ../risk-service
      dockerfile: Dockerfile
    container_name: insurance-risk-service
    ports:
      - "8082:8082"
    networks:
      - client-insurance
    environment:
      OTEL_SERVICE_NAME: risk-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=insurance,tenant.id=insurance-client,deployment.environment=dev
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRIC_EXPORT_INTERVAL: 15000
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4320}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      # Phase 6 (FR-06): gateway authenticates this tenant via bearer token.
      # Must match INSURANCE_TOKEN in the root observability .env.
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer ${INSURANCE_TOKEN:-dev-insurance-token-local-only}
      OTEL_INSTRUMENTATION_MICROMETER_ENABLED: "true"
      # Phase 8 fault injection (risk-service only). 0/0 = off. LATENCY_MS >
      # 2000 also trips insurance-api's 2s risk-evaluation timeout (timeout demo).
      CHAOS_LATENCY_MS: ${CHAOS_LATENCY_MS:-0}
      CHAOS_REJECT_RATE: ${CHAOS_REJECT_RATE:-0}

  insurance-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insurance-api
    # Host port 8083: banking-api already occupies host 8080.
    # Container still serves 8080; test via http://localhost:8083.
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      risk-service:
        condition: service_started
    networks:
      - client-insurance
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/insurance_db
      SPRING_DATASOURCE_USERNAME: insurance_user
      SPRING_DATASOURCE_PASSWORD: insurance_pass
      RISK_SERVICE_URL: http://risk-service:8082
      OTEL_SERVICE_NAME: insurance-api
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=insurance,tenant.id=insurance-client,deployment.environment=dev
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRIC_EXPORT_INTERVAL: 15000
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4320}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      # Phase 6 (FR-06): gateway authenticates this tenant via bearer token.
      # Must match INSURANCE_TOKEN in the root observability .env.
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer ${INSURANCE_TOKEN:-dev-insurance-token-local-only}
      OTEL_INSTRUMENTATION_MICROMETER_ENABLED: "true"

  postgres:
    image: postgres:16-alpine
    container_name: insurance-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: insurance_db
      POSTGRES_USER: insurance_user
      POSTGRES_PASSWORD: insurance_pass
    volumes:
      - insurance-postgres-data:/var/lib/postgresql/data
    networks:
      - client-insurance
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance_user -d insurance_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  insurance-postgres-data:

networks:
  client-insurance:
    name: client-insurance
