services:
  fraud-service:
    build:
      context: ../fraud-service
      dockerfile: Dockerfile
    container_name: digital-fraud-service
    ports:
      - "${FRAUD_SERVICE_PORT:-8081}:8081"
    networks:
      - client-banking
    environment:
      OTEL_SERVICE_NAME: fraud-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=banking,tenant.id=banking-client,deployment.environment=${ENV:-dev}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      # Phase 6 (FR-06): gateway authenticates this tenant via bearer token.
      # Must match BANKING_TOKEN in the root observability .env.
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer ${BANKING_TOKEN:-dev-banking-token-local-only}
      OTEL_INSTRUMENTATION_MICROMETER_ENABLED: "true"
      # Phase 8 fault injection (fraud-service only). 0/0 = off. LATENCY_MS >
      # 2000 also trips banking-api's 2s fraud-check timeout (timeout demo).
      CHAOS_LATENCY_MS: ${CHAOS_LATENCY_MS:-0}
      CHAOS_REJECT_RATE: ${CHAOS_REJECT_RATE:-0}

  banking-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital-banking-api
    ports:
      - "${BANKING_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      fraud-service:
        condition: service_started
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-digital_banking}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-digital_banking}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-digital_banking}
      # Fraud Service (Phase 4: distributed tracing)
      FRAUD_SERVICE_URL: http://fraud-service:8081
      # OpenTelemetry (Phase 6: OTLP/gRPC to the gateway's banking listener.
      # host.docker.internal resolves out of the box under Docker Desktop; if
      # you move to native Docker Engine/WSL2 without Docker Desktop, add
      # `extra_hosts: ["host.docker.internal:host-gateway"]` here.)
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-banking-api}
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=banking,tenant.id=banking-client,deployment.environment=${ENV:-dev}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      # Phase 6 (FR-06): gateway authenticates this tenant via bearer token.
      # Must match BANKING_TOKEN in the root observability .env.
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer ${BANKING_TOKEN:-dev-banking-token-local-only}
      # Micrometer meters (TransferMetrics: bank.transfers.total, bank.fraud.*)
      # are NOT bridged into OTLP by default — this opts the agent in.
      OTEL_INSTRUMENTATION_MICROMETER_ENABLED: "true"
    networks:
      - client-banking

  postgres:
    image: postgres:16-alpine
    container_name: digital-banking-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_banking}
      POSTGRES_USER: ${POSTGRES_USER:-digital_banking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digital_banking}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - digital-banking-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digital_banking} -d ${POSTGRES_DB:-digital_banking}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - client-banking

volumes:
  digital-banking-postgres-data:

networks:
  client-banking:
    name: client-banking
