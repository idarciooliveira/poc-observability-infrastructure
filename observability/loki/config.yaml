# Loki 3.7.6 — single-node, filesystem storage.
#
# Prod hardening #1: true storage isolation via auth_enabled: true.
# Every push/query must carry X-Scope-OrgID (banking-client | insurance-client).
# The collector sets it per-tenant (see collector-config.yaml); Grafana
# operator datasources use the federated value "banking-client|insurance-client"
# (requires multi_tenant_queries_enabled below), per-tenant datasources use a
# single ID to prove isolation. NOTE: pre-existing data written under
# auth_enabled:false lives under tenant "fake" and becomes invisible — reset
# volumes once after enabling (scripts/down -Volumes).
#
# Store note: tsdb/v13 is REQUIRED for native OTLP ingestion + structured
# metadata on Loki 3.x.

auth_enabled: true

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

querier:
  # Operator (Grafana) can query banking-client|insurance-client in one call.
  # Push (/otlp) still requires a SINGLE tenant — federation is query-only.
  multi_tenant_queries_enabled: true

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

limits_config:
  retention_period: 168h # 7d (Phase 3 default)
  allow_structured_metadata: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Phase 8 fix: custom resource attributes land in structured metadata by
  # default, which stream selectors ({tenant_id="..."}) cannot match — the
  # tenant log panels would silently show nothing. Promote tenant.id to a
  # real index label (dots become underscores). Applies to NEW streams only;
  # pre-fix history stays searchable via service_name + metadata filters.
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - tenant.id
