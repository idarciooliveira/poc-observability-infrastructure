# Grafana dashboard provider — Phase 8 (FR-12).
# Ships tenant-overview, banking, insurance, infrastructure boards as JSON
# in this directory; auto-reloaded every 10s, UI edits allowed.
apiVersion: 1

providers:
  - name: poc
    folder: POC
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
