# OTEL Gateway (contrib 0.135.0) — Phase 6 multi-tenancy enforcement.
#
# Public ingestion only. One listener pair + one bearertokenauth instance per
# tenant; the token decides the tenant, NOT any client-supplied attribute:
#   banking   gRPC :4317 / HTTP :4318  -> tenant.id=banking-client
#   insurance gRPC :4320 / HTTP :4321  -> tenant.id=insurance-client
#   retail    gRPC :4322 / HTTP :4323  -> tenant.id=retail-client (Ch.2:
#             served ONLY via client-collector-retail-orders -> Traefik)
#
# transform/<tenant> uses `set` (upsert): a spoofed tenant.id from the client
# is OVERWRITTEN server-side, never trusted. The internal collector keeps only
# `insert` defaults, so it cannot mask a gateway labeling bug.
#
# Tokens come from container env (BANKING_TOKEN / INSURANCE_TOKEN /
# RETAIL_TOKEN, see root .env.example). Real values are never committed;
# compose fails closed when they are absent (no dev fallbacks).

extensions:
  bearertokenauth/banking:
    # Validates `Authorization: Bearer <BANKING_TOKEN>` (gRPC + HTTP).
    token: "${env:BANKING_TOKEN}"
  bearertokenauth/insurance:
    token: "${env:INSURANCE_TOKEN}"
  bearertokenauth/retail:
    # Validates `Authorization: Bearer <RETAIL_TOKEN>` (gRPC + HTTP).
    # Held ONLY by client-collector-retail-orders, never by the app.
    token: "${env:RETAIL_TOKEN}"
  health_check:
  zpages:

receivers:
  otlp/banking:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
        auth:
          authenticator: bearertokenauth/banking
      http:
        endpoint: "0.0.0.0:4318"
        auth:
          authenticator: bearertokenauth/banking

  otlp/insurance:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4320"
        auth:
          authenticator: bearertokenauth/insurance
      http:
        endpoint: "0.0.0.0:4321"
        auth:
          authenticator: bearertokenauth/insurance

  otlp/retail:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4322"
        auth:
          authenticator: bearertokenauth/retail
      http:
        endpoint: "0.0.0.0:4323"
        auth:
          authenticator: bearertokenauth/retail

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  # Authoritative tenant identity: `set` overwrites any client value (upsert).
  transform/banking:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(resource.attributes["tenant.id"], "banking-client")
          - set(resource.attributes["service.namespace"], "banking")
    metric_statements:
      - context: resource
        statements:
          - set(resource.attributes["tenant.id"], "banking-client")
          - set(resource.attributes["service.namespace"], "banking")
    log_statements:
      - context: resource
        statements:
          - set(resource.attributes["tenant.id"], "banking-client")
          - set(resource.attributes["service.namespace"], "banking")

  transform/insurance:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(resource.attributes["tenant.id"], "insurance-client")
          - set(resource.attributes["service.namespace"], "insurance")
    metric_statements:
      - context: resource
        statements:
          - set(resource.attributes["tenant.id"], "insurance-client")
          - set(resource.attributes["service.namespace"], "insurance")
    log_statements:
      - context: resource
        statements:
          - set(resource.attributes["tenant.id"], "insurance-client")
          - set(resource.attributes["service.namespace"], "insurance")

  # Ch.2 retail identity: `set` overwrites any tenant.id from the app OR the
  # customer-side collector — neither is trusted (FR-06 analogue for retail).
  transform/retail:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(resource.attributes["tenant.id"], "retail-client")
          - set(resource.attributes["service.namespace"], "retail")
    metric_statements:
      - context: resource
        statements:
          - set(resource.attributes["tenant.id"], "retail-client")
          - set(resource.attributes["service.namespace"], "retail")
    log_statements:
      - context: resource
        statements:
          - set(resource.attributes["tenant.id"], "retail-client")
          - set(resource.attributes["service.namespace"], "retail")

  batch:
    send_batch_size: 1024
    timeout: 10s

  # Prod hardening #2: drop health/readiness noise before it reaches storage.
  filter:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.target"] == "/health" or attributes["http.target"] == "/ready"'
        - 'attributes["http.route"] == "/health" or attributes["http.route"] == "/ready"'
    logs:
      log_record:
        - 'attributes["http.target"] == "/health" or attributes["http.target"] == "/ready"'

exporters:
  # Per-tenant downstream: distinct internal collector ports keep the tenant
  # boundary explicit even if X-Scope-OrgID handling ever regresses. Both live
  # on the observability network only (no host ports).
  otlp/banking:
    endpoint: "otel-collector:4317"
    tls:
      insecure: true
    sending_queue:
      enabled: true
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
  otlp/insurance:
    endpoint: "otel-collector:4320"
    tls:
      insecure: true
    sending_queue:
      enabled: true
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
  otlp/retail:
    endpoint: "otel-collector:4322"
    tls:
      insecure: true
    sending_queue:
      enabled: true
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  extensions: [bearertokenauth/banking, bearertokenauth/insurance, bearertokenauth/retail, health_check, zpages]
  pipelines:
    traces/banking:
      receivers: [otlp/banking]
      processors: [memory_limiter, transform/banking, filter, batch]
      exporters: [otlp/banking]
    metrics/banking:
      receivers: [otlp/banking]
      processors: [memory_limiter, transform/banking, batch]
      exporters: [otlp/banking]
    logs/banking:
      receivers: [otlp/banking]
      processors: [memory_limiter, transform/banking, filter, batch]
      exporters: [otlp/banking]
    traces/insurance:
      receivers: [otlp/insurance]
      processors: [memory_limiter, transform/insurance, filter, batch]
      exporters: [otlp/insurance]
    metrics/insurance:
      receivers: [otlp/insurance]
      processors: [memory_limiter, transform/insurance, batch]
      exporters: [otlp/insurance]
    logs/insurance:
      receivers: [otlp/insurance]
      processors: [memory_limiter, transform/insurance, filter, batch]
      exporters: [otlp/insurance]
    traces/retail:
      receivers: [otlp/retail]
      processors: [memory_limiter, transform/retail, filter, batch]
      exporters: [otlp/retail]
    metrics/retail:
      receivers: [otlp/retail]
      processors: [memory_limiter, transform/retail, batch]
      exporters: [otlp/retail]
    logs/retail:
      receivers: [otlp/retail]
      processors: [memory_limiter, transform/retail, filter, batch]
      exporters: [otlp/retail]
