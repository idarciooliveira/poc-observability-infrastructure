# Collector contrib 0.135.0 — internal fan-out with true tenant isolation.
#
# Prod hardening #1: per-tenant receivers + per-tenant backend exporters, each
# carrying its own X-Scope-OrgID. Banking traffic arriving on otlp/banking can
# ONLY reach backends as banking-client, insurance ONLY as insurance-client —
# storage isolation (Loki auth_enabled, Mimir multitenancy, Tempo multitenancy),
# not just the tenant.id label.
#
# Prod hardening #2: every exporter has sending_queue + retry_on_failure so a
# Loki/Tempo/Mimir restart does not drop spans; filter drops /health noise.
#
# Sensitive-data handling: `transform` (OTTL replace_pattern), NOT `redaction`.
# `redaction` is an attribute allow/block-list filter and cannot scrub patterns
# embedded inside strings; account numbers can appear in plain log bodies, so
# both span/log attributes AND log bodies are scrubbed.

receivers:
  # Banking lane — fed ONLY by gateway otlp/banking (internal network).
  otlp/banking:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"
  # Insurance lane — fed ONLY by gateway otlp/insurance (internal network).
  otlp/insurance:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4320"
      http:
        endpoint: "0.0.0.0:4321"

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Quarantine default for traffic that bypassed the gateway (reachable only
  # from the observability network). `insert` fills gaps ONLY — the gateway
  # already upserted the authoritative tenant, so this never overrides it.
  resource:
    attributes:
      - key: tenant.id
        action: insert
        value: unknown
      - key: service.namespace
        action: insert
        value: unknown

  # Scrub digit runs of 8+ (fake account numbers) from attributes and bodies.
  transform:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(span.attributes["url.path"], "\\b\\d{8,}\\b", "[REDACTED]") where span.attributes["url.path"] != nil
          - replace_pattern(span.attributes["http.target"], "\\b\\d{8,}\\b", "[REDACTED]") where span.attributes["http.target"] != nil
    log_statements:
      - context: log
        statements:
          - replace_pattern(log.attributes["url.path"], "\\b\\d{8,}\\b", "[REDACTED]") where log.attributes["url.path"] != nil
          - replace_pattern(log.body, "\\b\\d{8,}\\b", "[REDACTED]") where IsString(log.body)

  filter:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.target"] == "/health" or attributes["http.target"] == "/ready"'
    logs:
      log_record:
        - 'attributes["http.target"] == "/health" or attributes["http.target"] == "/ready"'

  batch:
    send_batch_size: 1024
    timeout: 10s

exporters:
  otlp/tempo_banking:
    endpoint: "tempo:4317"
    tls:
      insecure: true
    headers:
      X-Scope-OrgID: banking-client
    sending_queue:
      enabled: true
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  otlp/tempo_insurance:
    endpoint: "tempo:4317"
    tls:
      insecure: true
    headers:
      X-Scope-OrgID: insurance-client
    sending_queue:
      enabled: true
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  otlphttp/loki_banking:
    endpoint: "http://loki:3100/otlp/"
    headers:
      X-Scope-OrgID: banking-client
    sending_queue:
      enabled: true
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  otlphttp/loki_insurance:
    endpoint: "http://loki:3100/otlp/"
    headers:
      X-Scope-OrgID: insurance-client
    sending_queue:
      enabled: true
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  prometheusremotewrite/mimir_banking:
    endpoint: "http://mimir:9009/api/v1/push"
    headers:
      X-Scope-OrgID: banking-client
    resource_to_telemetry_conversion:
      enabled: true

  prometheusremotewrite/mimir_insurance:
    endpoint: "http://mimir:9009/api/v1/push"
    headers:
      X-Scope-OrgID: insurance-client
    resource_to_telemetry_conversion:
      enabled: true

extensions:
  health_check:
  zpages:

service:
  extensions: [health_check, zpages]
  pipelines:
    traces/banking:
      receivers: [otlp/banking]
      processors: [memory_limiter, resource, transform, filter, batch]
      exporters: [otlp/tempo_banking]
    metrics/banking:
      receivers: [otlp/banking]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheusremotewrite/mimir_banking]
    logs/banking:
      receivers: [otlp/banking]
      processors: [memory_limiter, resource, transform, filter, batch]
      exporters: [otlphttp/loki_banking]
    traces/insurance:
      receivers: [otlp/insurance]
      processors: [memory_limiter, resource, transform, filter, batch]
      exporters: [otlp/tempo_insurance]
    metrics/insurance:
      receivers: [otlp/insurance]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheusremotewrite/mimir_insurance]
    logs/insurance:
      receivers: [otlp/insurance]
      processors: [memory_limiter, resource, transform, filter, batch]
      exporters: [otlphttp/loki_insurance]
