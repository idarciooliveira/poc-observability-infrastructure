# Tempo 2.8.0 — single-node, local filesystem backend.
#
# Prod hardening #1: true storage isolation via multitenancy_enabled: true.
# Every push/query must carry X-Scope-OrgID. The collector sets it per-tenant;
# Grafana operator datasource uses federated "banking-client|insurance-client"
# (multi_tenant_queries_enabled). NOTE: traces written before enabling live
# under the single-tenant path — reset volumes once after enabling.
#
# The Collector is Tempo's OTLP client (gRPC :4317). Restricting which clients
# may reach Tempo is a network-isolation concern, enforced by Docker networks —
# not by receiver settings here. Both OTLP receivers are enabled: gRPC is the
# Collector path, HTTP stays for manual testing.

multitenancy_enabled: true

query_frontend:
  multi_tenant_queries_enabled: true

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces
    wal:
      path: /tmp/tempo/wal
