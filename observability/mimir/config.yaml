# Mimir 2.16.0 — single-binary (target: all), filesystem storage.
# Shape follows the official "Get started with Grafana Mimir" monolithic demo.
#
# Prod hardening #1: true storage isolation via multitenancy_enabled: true.
# Every push/query must carry X-Scope-OrgID. The collector sets it per-tenant;
# Grafana operator datasources use federated "banking-client|insurance-client"
# (requires tenant_federation.enabled). NOTE: data written with multitenancy
# off lives under tenant "anonymous" — reset volumes once after enabling.
#
# Do not use this configuration in production. It is for demonstration
# purposes only.

multitenancy_enabled: true

tenant_federation:
  enabled: true

blocks_storage:
  backend: filesystem
  bucket_store:
    sync_dir: /tmp/mimir/tsdb-sync
  filesystem:
    dir: /tmp/mimir/data/tsdb
  tsdb:
    dir: /tmp/mimir/tsdb

compactor:
  data_dir: /tmp/mimir/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /tmp/mimir/rules

server:
  http_listen_port: 9009
  log_level: info

store_gateway:
  sharding_ring:
    replication_factor: 1

# Phase 8 fix: the collector promotes resource attributes to metric labels
# (resource_to_telemetry_conversion), and the Java agent ships ~32 of them
# (container_*, process_*, host_*, telemetry_*). Above Mimir's default limit
# of 30 label names per series, which silently dropped the
# http_server_request_duration_* histograms the latency dashboards need.
# 64 keeps them; high-cardinality labels are acceptable for this POC.
limits:
  max_label_names_per_series: 64

# No anonymous usage reporting from the POC stack.
usage_stats:
  enabled: false
