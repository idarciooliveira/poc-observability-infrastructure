# Mimir 2.16.0 — Phase 3 single-binary (target: all), filesystem storage.
# Shape follows the official "Get started with Grafana Mimir" monolithic demo.
#
# Phase 3 simplification: multitenancy_enabled: false (same caveat as Loki —
# real tenant separation needs multitenancy + X-Scope-OrgID, revisited in
# Phase 6). With multitenancy off, the no-auth tenant receives all writes.
#
# Do not use this configuration in production. It is for demonstration
# purposes only.

multitenancy_enabled: false

blocks_storage:
  backend: filesystem
  bucket_store:
    sync_dir: /tmp/mimir/tsdb-sync
  filesystem:
    dir: /tmp/mimir/data/tsdb
  tsdb:
    dir: /tmp/mimir/tsdb

compactor:
  data_dir: /tmp/mimir/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /tmp/mimir/rules

server:
  http_listen_port: 9009
  log_level: info

store_gateway:
  sharding_ring:
    replication_factor: 1

# No anonymous usage reporting from the POC stack.
usage_stats:
  enabled: false
